services:
  - type: web
    name: barangay-minante-1
    runtime: python
    region: singapore
    # Free temporary demo only. Files on this service are ephemeral.
    plan: free
    numInstances: 1
    rootDir: barangay_system
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        fromDatabase:
          name: barangay-minante-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: barangay-minante-db
    databaseName: barangay_minante
    user: barangay_minante_user
    region: singapore
    plan: free
    diskSizeGB: 1
    postgresMajorVersion: "18"
    ipAllowList: []
